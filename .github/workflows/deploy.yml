name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npx nuxi generate --preset github_pages
        env:
          # The site is served from https://<user>.github.io/<repo-name>/
          SITE_BASE_URL: /${{ github.event.repository.name }}/
          # Add this under Settings → Secrets and variables → Actions
          NUXT_PUBLIC_TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
